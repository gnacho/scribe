name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Validar metadatos
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
          desktop-file-validate data/app.scribe.Scribe.desktop
          glib-compile-schemas --strict --dry-run data/
          appstreamcli validate --no-net data/app.scribe.Scribe.metainfo.xml

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libglib2.0-dev

      - uses: dtolnay/rust-toolchain@1.83

      - uses: Swatinem/rust-cache@v2

      - run: cargo check --locked
