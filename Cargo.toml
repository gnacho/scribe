[package]
name = "scribe"
version = "0.3.17"
edition = "2021"
authors = ["gnacho"]
description = "A native GNOME Markdown editor"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gtksourceview5 = { version = "0.9", package = "sourceview5", features = ["v5_10"] }
enchant = "0.3"
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
pulldown-cmark = "0.12"
gettext-rs = { version = "0.8", features = ["gettext-system"] }

# .deb (cargo-deb) and .rpm (cargo-generate-rpm) metadata. Built by the
# "packages" workflow on debian:trixie and fedora:latest; do not build these
# on other distros, the linked libraries and the auto-generated dependencies
# would not match the target.
[package.metadata.deb]
maintainer = "gnacho"
copyright = "2017-2026, gnacho"
license-file = ["LICENSE", "0"]
section = "editors"
priority = "optional"
assets = [
    ["target/release/scribe", "usr/bin/", "755"],
    ["data/io.github.gnacho.Scribe.desktop", "usr/share/applications/", "644"],
    ["data/io.github.gnacho.Scribe.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/io.github.gnacho.Scribe.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.gnacho.Scribe.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-off-symbolic.svg", "usr/share/icons/hicolor/scalable/actions/", "644"],
    ["data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-on-symbolic.svg", "usr/share/icons/hicolor/scalable/actions/", "644"],
    ["target/scribe-locale/es/LC_MESSAGES/scribe.mo", "usr/share/locale/es/LC_MESSAGES/", "644"],
]

[package.metadata.generate-rpm]
name = "scribe"
license = "AGPL-3.0-or-later"
summary = "A lightweight, native GNOME Markdown editor with live preview"
url = "https://github.com/gnacho/scribe"

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtksourceview5 = "*"
enchant2 = "*"

[[package.metadata.generate-rpm.assets]]
source = "target/release/scribe"
dest = "/usr/bin/scribe"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "data/io.github.gnacho.Scribe.desktop"
dest = "/usr/share/applications/io.github.gnacho.Scribe.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "data/io.github.gnacho.Scribe.metainfo.xml"
dest = "/usr/share/metainfo/io.github.gnacho.Scribe.metainfo.xml"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "data/io.github.gnacho.Scribe.gschema.xml"
dest = "/usr/share/glib-2.0/schemas/io.github.gnacho.Scribe.gschema.xml"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/hicolor/scalable/apps/io.github.gnacho.Scribe.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/io.github.gnacho.Scribe.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-off-symbolic.svg"
dest = "/usr/share/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-off-symbolic.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "data/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-on-symbolic.svg"
dest = "/usr/share/icons/hicolor/scalable/actions/io.github.gnacho.Scribe-preview-on-symbolic.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "target/scribe-locale/es/LC_MESSAGES/scribe.mo"
dest = "/usr/share/locale/es/LC_MESSAGES/scribe.mo"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/scribe/LICENSE"
doc = true
